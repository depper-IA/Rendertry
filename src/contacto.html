<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contacta a Rendertry para asesoría en personalización visual automotriz." />
  <title>Contacto | Rendertry — Visualizador de Personalización</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css">
  <style>
    .contact-hero {
      background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.9)), url('assets/contact-bg.png') center/cover no-repeat;
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 0 60px;
    }

    .contact-container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 3rem;
      align-items: center;
      background: rgba(10, 10, 10, 0.6);
      backdrop-filter: blur(20px);
      border-radius: 40px;
      padding: 4rem;
      border: 1px solid rgba(59, 130, 246, 0.2);
      box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8);
    }

    .contact-info h1 {
      font-family: 'Inter', sans-serif;
      font-size: 3.5rem;
      margin-bottom: 1.5rem;
      line-height: 1.1;
      color: white;
    }

    .contact-info p {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .info-item i {
      font-size: 1.5rem;
      color: var(--primary);
      width: 50px;
      height: 50px;
      background: rgba(59, 130, 246, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 15px;
    }

    .info-text h4 {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .info-text p {
      margin-bottom: 0;
      color: white;
      font-weight: 600;
    }

    .contact-form-premium {
      background: rgba(0, 0, 0, 0.5);
      padding: 3rem;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .contact-form-premium .form-group {
      margin-bottom: 1.5rem;
    }

    .contact-form-premium label {
      color: white;
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .contact-form-premium input,
    .contact-form-premium textarea,
    .contact-form-premium select {
      width: 100%;
      background: #050505;
      border: 1px solid var(--border-color);
      padding: 16px 20px;
      font-size: 1rem;
      border-radius: 15px;
      color: white;
    }

    .contact-form-premium input:focus,
    .contact-form-premium textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 18px;
      border-radius: 15px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-submit:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px var(--accent-glow);
    }

    @media (max-width: 950px) {
      .contact-container {
        grid-template-columns: 1fr;
        padding: 3rem 2rem;
        margin: 0 1rem;
      }

      .contact-info h1 {
        font-size: 2.5rem;
      }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main class="contact-hero">
    <div class="container">
      <div class="contact-container">
        <div class="contact-info">
          <h1>Agenda tu <span style="color:var(--primary);">Proyecto</span></h1>
          <p>Transformamos visiones en máquinas de alto rendimiento. Ponte en contacto con nuestro equipo técnico para
            una asesoría personalizada.</p>

          <div class="info-item">
            <i data-lucide="map-pin"></i>
            <div class="info-text">
              <h4>Ubicación</h4>
              <p>Cali - Colombia</p>
            </div>
          </div>

          <div class="info-item">
            <i data-lucide="phone"></i>
            <div class="info-text">
              <h4>Teléfono Directo</h4>
              <p>+57 3105436281</p>
            </div>
          </div>
          <div class="footer-social" style="margin-top: 2rem; justify-content: flex-start;">
            <a href="#" aria-label="Instagram"><i data-lucide="instagram"></i></a>
            <a href="#" aria-label="Twitter"><i data-lucide="twitter"></i></a>
            <a href="#" aria-label="YouTube"><i data-lucide="youtube"></i></a>
          </div>
        </div>

        <div class="contact-form-wrapper">
          <form id="contactForm" class="contact-form-premium">
            <div class="form-group">
              <label>Tu Nombre</label>
              <input type="text" placeholder="Ej: Marcos Pérez" required>
            </div>
            <div class="form-group">
              <label>Email de Contacto</label>
              <input type="email" placeholder="marcos@ejemplo.com" required>
            </div>
            <div class="form-group">
              <label>Tipo de Servicio</label>
              <select>
                <option>Visualización de Rines</option>
                <option>Cambio de Pintura / Wrap</option>
                <option>Accesorios Aerodinámicos</option>
                <option>Proyecto Completo</option>
              </select>
            </div>
            <div class="form-group">
              <label>Cuéntanos tu idea</label>
              <textarea rows="4" placeholder="¿Qué tienes en mente para tu auto?"></textarea>
            </div>
            <button type="submit" class="btn-submit">Enviar Solicitud de Asesoría</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
