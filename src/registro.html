<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crea tu cuenta y prueba Rendertry gratis por 7 días.">
  <title>Prueba 7 días gratis | Rendertry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="site-header"></div>

  <!-- HERO REGISTRO -->
  <section class="section" style="padding-top: 10rem; padding-bottom: 6rem; background: radial-gradient(circle at 50% 0%, rgba(230,57,70,0.15) 0%, transparent 60%);">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">

          <div class="text-center mb-4">
            <div class="eyebrow justify-content-center">Comienza gratis</div>
            <h1 class="hero-title" style="font-size: clamp(2rem, 4vw, 3rem);">
              Prueba Rendertry <span style="color: var(--primary);">7 días gratis</span>
            </h1>
            <p class="sec-sub mx-auto" style="max-width: 480px;">
              Crea tu cuenta en segundos. Sin tarjeta de crédito.
            </p>
          </div>

          <!-- TARJETA / FORMULARIO -->
          <div style="background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: 20px; padding: 2.5rem;">
            <form id="registerForm">
              <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <input type="text" class="form-control" name="name" placeholder="Tu nombre" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" name="email" placeholder="tucorreo@ejemplo.com" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
              </div>
              <button type="submit" class="btn-primary w-100" style="padding: 0.9rem;">
                Iniciar mi prueba gratis
              </button>
              <p class="text-center mt-3" style="font-size: 0.85rem; color: var(--text-muted);">
                ¿Ya tienes cuenta? <a href="login.html" style="color: var(--primary);">Inicia sesión</a>
              </p>
            </form>
          </div>

        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
